" height="220" fill="#F3EDE1" stroke="#1A1916" stroke-width="3"/><rect x="710" y="560" width="180" height="10" fill="#1A1916" opacity=".6"/><rect x="710" y="590" width="160" height="10" fill="#1A1916" opacity=".6"/><rect x="710" y="620" width="140" height="10" fill="#1A1916" opacity=".6"/><rect x="710" y="650" width="120" height="10" fill="#1A1916" opacity=".6"/><circle cx="800" cy="520" r="14" fill="#C8432B"/></g>
