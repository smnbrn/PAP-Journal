<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-label="Illustrazione: foglietti di appunti appuntati su una bacheca">
<title>Illustrazione: foglietti di appunti appuntati su una bacheca</title>
<defs>
<filter id="noise" x="0" y="0" width="100%" height="100%">
